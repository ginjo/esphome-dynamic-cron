; See documentation:
;   https://docs.platformio.org/en/stable/projectconf/index.html
;   https://docs.platformio.org/en/stable/projectconf/sections/env/index.html#options
;
[common]
lib_deps =
build_flags =
upload_flags =
;
[platformio]
description = ESPHome 2024.7.3
;
[env:native]
platform = native
test_framework = unity
build_flags =
    -fexceptions
    -std=gnu++17
    -D IS_NATIVE=1
build_unflags =
    -fno-exceptions
    -std=gnu++11
lib_compat_mode = off
; Loading order matters!
lib_deps =
    Croncpp = https://github.com/mariusbancila/croncpp.git
    ArduinoFake
    throwtheswitch/Unity@^2.5.2
    ${common.lib_deps}
build_src_filter =
    -<**/esphome/*>
test_build_src = yes
lib_ldf_mode = off
;
;
; This block was taken from the dynamicron test project's build dir.
[env:esp32]
board = esp32doit-devkit-v1
board_build.partitions = test/partitions.csv
board_upload.flash_size = 4MB
build_flags =
    -DESPHOME_LOG_LEVEL=ESPHOME_LOG_LEVEL_DEBUG
    -DUSE_ARDUINO
    -DUSE_ESP32
    -DUSE_ESP32_FRAMEWORK_ARDUINO
    -DUSE_ESP32_VARIANT_ESP32
    -Wno-sign-compare
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -fexceptions
    -fno-exceptions
    -std=gnu++17
    -I /esphome
    -D IS_NATIVE=0
build_unflags =
    -fno-exceptions
    -std=gnu++11
extra_scripts =
    post:test/post_build.py
framework = arduino
lib_deps =
    Croncpp=https://github.com/mariusbancila/croncpp.git
    Preferences
    FS
    esphome/noise-c@0.1.4
    bblanchon/ArduinoJson@6.18.5
    ${common.lib_deps}
build_src_filter =
  +<**/core/application.cpp>
  +<**/core/component.cpp>
  +<**/core/component_iterator.cpp>
  +<**/core/application.cpp>
  +<**/core/controller.cpp>
  +<**/core/entity_base.cpp>
  +<**/core/helpers.cpp>
  +<**/core/log.cpp>
  +<**/core/ring_buffer.cpp>
  ;+<**/core/scheduler.cpp>
  +<**/core/string_ref.cpp>
  +<**/core/time.cpp>
  +<**/core/util.cpp>
  +<**/components/esp32/*.cpp>
  +<**/components/esphome/*.cpp>
  +<**/components/json/*.cpp>
  +<**/components/logger/*.cpp>
  +<**/components/md5/*.cpp>
  +<**/components/safe_mode/*.cpp>
  +<**/components/sntp/*.cpp>
  +<**/components/socket/*.cpp>
  +<**/components/switch/*.cpp>
  +<**/components/text/*.cpp>
  +<**/components/text_sensor/*.cpp>
  +<**/components/time/*.cpp>
lib_ldf_mode = deep+
lib_compat_mode = off
platform = platformio/espressif32@5.4.0
platform_packages =
    platformio/framework-arduinoespressif32@~3.20005.0
test_framework = unity
test_build_src = yes
