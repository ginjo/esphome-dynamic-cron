; See documentation:
;   https://docs.platformio.org/en/stable/projectconf/index.html
;
[common]
lib_deps =
build_flags =
upload_flags =
;
[platformio]
;description = ESPHome 2024.7.3
description = ESPHome 2025.9.1
;
[env:native]
platform = native
test_framework = unity
build_flags =
    -fexceptions
    -std=gnu++17
    -I esphome/components/dynamic_cron
    -D IS_NATIVE=1
    -D COMPILE_TESTS=1
build_unflags =
    -fno-exceptions
    -std=gnu++11
; Loading order matters!
lib_deps =
    Croncpp = https://github.com/mariusbancila/croncpp.git
;    ArduinoFake
    throwtheswitch/Unity@^2.5.2
    ${common.lib_deps}
build_src_filter =
    -<**/esphome/*>
test_ignore =
  misc
  esphome_config
test_build_src = no
; See here for these modes: https://docs.platformio.org/en/latest/librarymanager/ldf.html
lib_ldf_mode = chain
lib_compat_mode = soft
;
;
; We can't run the esphome build from platformio anymore, since esphome now uses
; their own forked version one of the platformio dependencies.
; Instead, just run 'esphome compile test/esphome_config/dynamicron.yml'.
[env:esphome]
board = esp32doit-devkit-v1
board_build.partitions = test/partitions.csv
board_upload.flash_size = 4MB
build_flags =
    -DESPHOME_LOG_LEVEL=ESPHOME_LOG_LEVEL_VERBOSE
    -DUSE_ARDUINO
    -DUSE_ESP32
    -DUSE_ESP32_FRAMEWORK_ARDUINO
    -DUSE_ESP32_VARIANT_ESP32
    -Wno-sign-compare
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -fexceptions
    -std=gnu++17
    -I /esphome
    -I esphome/components/dynamic_cron
    -D IS_NATIVE=0
build_unflags =
    -fno-exceptions
    -std=gnu++11
    -fno-rtti
extra_scripts =
    post:test/post_build.py
framework = arduino
lib_deps =
    Croncpp=https://github.com/mariusbancila/croncpp.git
    Preferences
    FS
    esphome/noise-c@0.1.4
    bblanchon/ArduinoJson@6.18.5
    ${common.lib_deps}
build_src_filter =
    +<**/core/application.cpp>
    +<**/core/component.cpp>
    +<**/core/component_iterator.cpp>
    +<**/core/application.cpp>
    +<**/core/controller.cpp>
    +<**/core/entity_base.cpp>
    +<**/core/helpers.cpp>
    +<**/core/log.cpp>
    +<**/core/ring_buffer.cpp>
    ;+<**/core/scheduler.cpp>
    +<**/core/string_ref.cpp>
    +<**/core/time.cpp>
    +<**/core/util.cpp>
    +<**/components/esp32/*.cpp>
    +<**/components/esphome/*.cpp>
    +<**/components/json/*.cpp>
    +<**/components/logger/*.cpp>
    +<**/components/md5/*.cpp>
    +<**/components/safe_mode/*.cpp>
    +<**/components/sntp/*.cpp>
    +<**/components/socket/*.cpp>
    +<**/components/switch/*.cpp>
    +<**/components/text/*.cpp>
    +<**/components/text_sensor/*.cpp>
    +<**/components/time/*.cpp>
test_ignore =
    misc
    esphome_config
lib_ldf_mode = chain
lib_compat_mode = soft
; See https://docs.platformio.org/en/latest/projectconf/sections/env/options/platform/platform.html
;platform = platformio/espressif32@5.4.0
platform = platformio/espressif32@^6.1.0
platform_packages =
    platformio/framework-arduinoespressif32@~3.20005.0
test_framework = unity
test_build_src = yes
;test_port = boblobla
